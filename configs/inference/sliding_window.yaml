input:
  volume:
    "data/raw/images/example_case.nii.gz"

output:
  dir: outputs/inference
  save_preview_gif: true
  preview_gif_duration_ms: 80

checkpoint:
  path: checkpoints/best_model.pth

sliding_window:
  patch_size: [96, 96, 96]
  overlap: 0.5
  batch_size: 4

device: cuda
num_classes: 2
