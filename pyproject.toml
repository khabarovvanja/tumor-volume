[project]
name = "tumor-volume"
version = "0.1.0"
description = "3D segmentation of tumors using PET followed by tumor volume calculation"
authors = [
    {name = "Ivan Khabarov"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "3.10.19"
dependencies = [
    "torch (>=2.9.1,<3.0.0)",
    "torchvision (>=0.24.1,<0.25.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
    "mlflow (>=3.8.1,<4.0.0)",
    "fire (>=0.7.1,<0.8.0)",
    "nibabel (>=5.3.3,<6.0.0)",
    "simpleitk (>=2.5.3,<3.0.0)",
    "dvc (>=3.65.0,<4.0.0)",
    "dvc-gdrive (>=3.0.1,<4.0.0)",
    "pyopenssl (>=25.3.0,<26.0.0)",
    "cryptography (>=46.0.3,<47.0.0)",
    "dvc-s3 (>=3.2.2,<4.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
